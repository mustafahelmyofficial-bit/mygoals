<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الشخصية</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f0e6 0%, #e8dfd1 50%, #d7c7b2 100%);
      --glass-bg: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(212, 175, 55, 0.35);
      --primary-brown: #3e2723;
      --accent-gold: #d4af37;
      --accent-gold-hover: #b89628;
      --text-dark: #2c1d11;
      --text-muted: #6d5d53;
      --card-shadow: 0 8px 32px 0 rgba(62, 39, 35, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-dark);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px 0;
    }

    header h1 {
      color: var(--primary-brown);
      font-weight: 800;
      font-size: 2rem;
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--card-shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding-bottom: 12px;
    }

    .card-header h2 {
      font-size: 1.3rem;
      color: var(--primary-brown);
      font-weight: 700;
    }

    .icon-gold {
      color: var(--accent-gold);
      font-size: 1.4rem;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-dark);
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--accent-gold);
      background: rgba(255, 255, 255, 0.9);
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.3s ease;
      white-space: nowrap;
    }

    .btn-gold:hover {
      background: var(--accent-gold-hover);
    }

    .days-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
    }

    .day-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.15);
      padding: 12px 15px;
      border-radius: 12px;
    }

    .day-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .day-note {
      font-size: 0.95rem;
      color: var(--primary-brown);
      font-weight: 600;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #c94a4a;
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .delete-btn:hover { opacity: 1; }

    .badge-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .badge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.4);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .badge-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>لوحة التحكم الشخصية</h1>
    <p>نظام متابعة أوفلاين محلي بالكامل</p>
  </header>

  <div class="dashboard-grid">

    <!-- قسم سجل الأيام -->
    <div class="glass-card">
      <div class="card-header">
        <i class="fas fa-calendar-alt icon-gold"></i>
        <h2>سجل الأيام</h2>
      </div>
      
      <form id="add-day-form" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
        <input type="date" id="day-date" required>
        <div class="input-group">
          <input type="text" id="day-note" placeholder="إنجاز اليوم أو ملاحظة..." required>
          <button type="submit" class="btn-gold"><i class="fas fa-plus"></i></button>
        </div>
      </form>

      <div id="days-log-container" class="days-list"></div>
    </div>

    <!-- قسم متابعة المهام والأنشطة -->
    <div class="glass-card">
      <div class="card-header">
        <i class="fas fa-tasks icon-gold"></i>
        <h2>المهام والأنشطة</h2>
      </div>
      
      <div class="badge-list">
        <div class="badge-item">
          <span class="badge-title"><i class="fas fa-dumbbell icon-gold"></i> الجيم</span>
          <input type="checkbox" id="gym-check" style="width: 18px; height: 18px; accent-color: var(--accent-gold);">
        </div>
        <div class="badge-item">
          <span class="badge-title"><i class="fas fa-language icon-gold"></i> الإنجليزية</span>
          <input type="checkbox" id="english-check" style="width: 18px; height: 18px; accent-color: var(--accent-gold);">
        </div>
        <div class="badge-item">
          <span class="badge-title"><i class="fas fa-drafting-compass icon-gold"></i> الهندسة والتصميم</span>
          <input type="checkbox" id="engineering-check" style="width: 18px; height: 18px; accent-color: var(--accent-gold);">
        </div>
        <div class="badge-item">
          <span class="badge-title"><i class="fas fa-video icon-gold"></i> صناعة المحتوى</span>
          <input type="checkbox" id="content-check" style="width: 18px; height: 18px; accent-color: var(--accent-gold);">
        </div>
      </div>
    </div>

    <!-- قسم التذكير ومواقيت الصلاة -->
    <div class="glass-card">
      <div class="card-header">
        <i class="fas fa-mosque icon-gold"></i>
        <h2>مواقيت الصلاة والتذكير</h2>
      </div>
      <div style="background: rgba(255,255,255,0.3); padding: 15px; border-radius: 12px; text-align: center; font-weight: 600; border: 1px dashed var(--accent-gold);">
        "إن الصلاة كانت على المؤمنين كتاباً موقوتاً"
      </div>
    </div>

  </div>

  <script>
    // --- حفظ واسترجاع بيانات سجل الأيام محلياً بدون إنترنت ---
    const form = document.getElementById('add-day-form');
    const dateInput = document.getElementById('day-date');
    const noteInput = document.getElementById('day-note');
    const container = document.getElementById('days-log-container');

    if (dateInput) dateInput.valueAsDate = new Date();

    function getStoredDays() {
      const days = localStorage.getItem('my_offline_days');
      return days ? JSON.parse(days) : [];
    }

    function saveDays(days) {
      localStorage.setItem('my_offline_days', JSON.stringify(days));
    }

    function renderDays() {
      if (!container) return;
      const days = getStoredDays();
      container.innerHTML = '';

      if (days.length === 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 15px;">لا توجد أيام مسجلة بعد.</div>';
        return;
      }

      days.sort((a, b) => new Date(b.date) - new Date(a.date));

      days.forEach((item, index) => {
        const dayEl = document.createElement('div');
        dayEl.className = 'day-item';
        dayEl.innerHTML = `
          <div class="day-info">
            <span class="day-date"><i class="far fa-calendar"></i> ${item.date}</span>
            <span class="day-note">${item.note}</span>
          </div>
          <button class="delete-btn" onclick="deleteDay(${index})" title="حذف">
            <i class="fas fa-trash-alt"></i>
          </button>
        `;
        container.appendChild(dayEl);
      });
    }

    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const newDay = { date: dateInput.value, note: noteInput.value.trim() };
        if (!newDay.note) return;
        const days = getStoredDays();
        days.push(newDay);
        saveDays(days);
        noteInput.value = '';
        renderDays();
      });
    }

    window.deleteDay = function(index) {
      const days = getStoredDays();
      days.sort((a, b) => new Date(b.date) - new Date(a.date));
      days.splice(index, 1);
      saveDays(days);
      renderDays();
    };

    // --- حفظ علامات الصح للمهام محلياً ---
    const checkboxes = ['gym-check', 'english-check', 'engineering-check', 'content-check'];
    checkboxes.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.checked = localStorage.getItem(id) === 'true';
        el.addEventListener('change', () => {
          localStorage.setItem(id, el.checked);
        });
      }
    });

    renderDays();
  </script>
</body>
</html>
