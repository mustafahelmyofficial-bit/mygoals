<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق إدارة المهام والتعلم</title>
    <style>
        /* ==========================================
           1. التنسيقات والألوان (Dark Petrol Glassmorphism)
           ========================================== */
        :root {
            --bg-petrol-dark: #0d212b;
            --bg-petrol-light: #163646;
            --accent-gold: #d4af37;
            --text-primary: #e0e6ed;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(22, 54, 70, 0.45);
            --glass-border: rgba(212, 175, 55, 0.2);
            --success: #2e7d32;
            --warning: #f59e0b;
        }

        body {
            /* خلفية بترولية غامقة معتدلة */
            background: linear-gradient(135deg, var(--bg-petrol-dark) 0%, var(--bg-petrol-light) 100%);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* كروت Glassmorphism */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            color: var(--accent-gold);
            margin-top: 0;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            font-size: 1.25rem;
        }

        /* قائمة الأكورديون للغة الإنجليزية */
        .accordion-item {
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .accordion-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion-content {
            display: none;
            padding: 15px;
            background: rgba(0, 0, 0, 0.15);
        }

        .accordion-item.active .accordion-content {
            display: block;
        }

        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* قسم الإحصائيات واختيار التاريخ */
        .controls-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="date"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), #f39c12);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* عناصر المهام والأزرار */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 10px;
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-done { background: var(--success); color: white; }
        .btn-postpone { background: var(--warning); color: #111; }
        .btn-status { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. قسم الإحصائيات وسجل الأيام -->
    <section class="glass-panel">
        <h2>📊 الإحصائيات وسجل الأيام</h2>
        
        <div class="controls-group">
            <label for="task-date">اختر تاريخ اليوم للتعديل والتعقّب:</label>
            <input type="date" id="task-date" onchange="changeSelectedDate(this.value)">
        </div>

        <div class="progress-container">
            <div>نسبة إنجاز اليوم: <strong id="completion-percentage">0%</strong></div>
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div id="daily-tasks-list" style="margin-top: 15px;">
            <!-- يتم عرض مهام اليوم المحدد هنا -->
        </div>
    </section>

    <!-- 2. قسم فهرس اللغة الإنجليزية -->
    <section class="glass-panel">
        <h2>🇬🇧 فهرس دروس اللغة الإنجليزية</h2>
        
        <div id="english-accordion">
            <!-- المستوى الأول -->
            <div class="accordion-item" id="level-1">
                <div class="accordion-header" onclick="toggleAccordion('level-1')">
                    <span>المستوى الأول: الأساسيات</span>
                    <span class="icon">▼</span>
                </div>
                <div class="accordion-content">
                    
                    <div class="lesson-item">
                        <span>الدرس 1: القواعد الأساسية</span>
                        <div class="btn-group">
                            <button class="btn-status" onclick="setLessonStatus(event, 'l1_1', 'قيد المراجعة')">قيد المراجعة</button>
                            <button class="btn-done" onclick="setLessonStatus(event, 'l1_1', 'تمت المذاكرة')">تمت المذاكرة</button>
                        </div>
                    </div>

                    <div class="lesson-item">
                        <span>الدرس 2: التحدث والتركيب</span>
                        <div class="btn-group">
                            <button class="btn-status" onclick="setLessonStatus(event, 'l1_2', 'قيد المراجعة')">قيد المراجعة</button>
                            <button class="btn-done" onclick="setLessonStatus(event, 'l1_2', 'تمت المذاكرة')">تمت المذاكرة</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

</div>

<script>
    /* ==========================================
       2. البرمجة والمنطق (JavaScript)
       ========================================== */
    
    // ضبط تاريخ اليوم تلقائياً
    let currentDate = new Date().toISOString().split('T')[0];

    // قاعدة بيانات تجريبية للمهام
    let tasksData = {
        [currentDate]: [
            { id: 1, title: 'حفظ سورة البقرة', completed: false },
            { id: 2, title: 'مذاكرة لغة إنجليزية - 30 دقيقة', completed: true },
            { id: 3, title: 'الذهاب للجيم', completed: false }
        ]
    };

    let lessonsStatus = {};

    // التشغيل عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('task-date').value = currentDate;
        renderTasksForDate(currentDate);
    });

    // --- علاج مشكلة إغلاق الفهرس تلقائياً ---
    function toggleAccordion(levelId) {
        const item = document.getElementById(levelId);
        item.classList.toggle('active');
    }

    function setLessonStatus(event, lessonId, status) {
        // منع انتشار الحدث لكي لا ينغلق الفهرس
        if (event) {
            event.stopPropagation();
        }

        lessonsStatus[lessonId] = status;
        alert(`تم تحديث حالة الدرس إلى: ${status}`);
    }

    // --- إدارة الأيام والإحصائيات ---
    function changeSelectedDate(date) {
        currentDate = date;
        if (!tasksData[currentDate]) {
            tasksData[currentDate] = [];
        }
        renderTasksForDate(currentDate);
    }

    function renderTasksForDate(date) {
        const container = document.getElementById('daily-tasks-list');
        container.innerHTML = '';

        const tasks = tasksData[date] || [];

        if (tasks.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary);">لا توجد مهام مسجلة لهذا اليوم.</p>';
            updateStats(0);
            return;
        }

        tasks.forEach(task => {
            const taskEl = document.createElement('div');
            taskEl.className = `task-item ${task.completed ? 'completed' : ''}`;
            taskEl.innerHTML = `
                <span>${task.title}</span>
                <div class="btn-group">
                    <button class="btn-done" onclick="toggleTask(${task.id})">${task.completed ? 'إلغاء' : 'إنجاز'}</button>
                    <button class="btn-postpone" onclick="postponeTask(${task.id})">⏳ تأجيل</button>
                </div>
            `;
            container.appendChild(taskEl);
        });

        calculateDailyStats(tasks);
    }

    function toggleTask(taskId) {
        const tasks = tasksData[currentDate];
        const task = tasks.find(t => t.id === taskId);
        if (task) {
            task.completed = !task.completed;
            renderTasksForDate(currentDate);
        }
    }

    // --- خيار تأجيل المهمة لليوم التالي ---
    function postponeTask(taskId) {
        const tasks = tasksData[currentDate];
        const taskIndex = tasks.findIndex(t => t.id === taskId);

        if (taskIndex !== -1) {
            const [taskToMove] = tasks.splice(taskIndex, 1);

            // زيادة اليوم بمقدار 1
            const dateObj = new Date(currentDate);
            dateObj.setDate(dateObj.getDate() + 1);
            const nextDate = dateObj.toISOString().split('T')[0];

            if (!tasksData[nextDate]) {
                tasksData[nextDate] = [];
            }

            tasksData[nextDate].push(taskToMove);

            alert(`تم تأجيل المهمة إلى تاريخ: ${nextDate}`);
            renderTasksForDate(currentDate);
        }
    }

    // --- حساب النسبة المئوية لإنجاز اليوم ---
    function calculateDailyStats(tasks) {
        if (tasks.length === 0) {
            updateStats(0);
            return;
        }
        const completedCount = tasks.filter(t => t.completed).length;
        const percentage = Math.round((completedCount / tasks.length) * 100);
        updateStats(percentage);
    }

    function updateStats(percent) {
        document.getElementById('completion-percentage').innerText = `${percent}%`;
        document.getElementById('progress-fill').style.width = `${percent}%`;
    }
</script>
</body>
</html>
