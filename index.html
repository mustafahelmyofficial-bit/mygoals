<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard & History</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #2b2621 0%, #1a1614 100%);
      --glass-bg: rgba(245, 237, 224, 0.07);
      --glass-border: rgba(212, 175, 55, 0.25);
      --text-color: #f5ede0;
      --gold: #d4af37;
      --beige: #f5ede0;
      --brown-accent: #3d3229;
      --success-bg: rgba(46, 204, 113, 0.12);
      --success-border: #2ecc71;
      --danger-bg: rgba(231, 76, 60, 0.12);
      --danger-border: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      color: var(--gold);
      margin-bottom: 15px;
      text-align: center;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
    }

    /* History Cards */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .day-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 8px;
    }

    .day-date {
      font-weight: bold;
      color: var(--gold);
    }

    /* Section for Done vs Missed */
    .summary-box {
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.88rem;
    }

    .summary-box.done {
      background: var(--success-bg);
      border-right: 4px solid var(--success-border);
    }

    .summary-box.missed {
      background: var(--danger-bg);
      border-right: 4px solid var(--danger-border);
    }

    .summary-title {
      font-weight: bold;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-list {
      list-style: none;
      padding-right: 5px;
    }

    .summary-list li {
      margin-bottom: 3px;
      opacity: 0.9;
    }

    .empty-text {
      font-style: italic;
      opacity: 0.6;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>سجل الأيام والإنجازات</h1>
    
    <!-- السجل اليومي -->
    <div id="historyContainer" class="history-grid">
      <!-- الكروت هتنزل هنا ديناميكياً -->
    </div>
  </div>

  <script>
    // 1. إعدادات Firebase
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. قراءة البيانات وعرض السجل مباشرة
    const historyContainer = document.getElementById('historyContainer');

    db.ref('daily_history').on('value', (snapshot) => {
      const data = snapshot.val();
      historyContainer.innerHTML = '';

      if (!data) {
        historyContainer.innerHTML = '<p style="text-align:center; width:100%;">لا توجد بيانات مسجلة بعد.</p>';
        return;
      }

      // تحويل البيانات لمصفوفة وعرضها بترتيب أحدث الأيام
      Object.keys(data).reverse().forEach(dateKey => {
        const day = data[dateKey];
        const tasks = day.tasks || [];

        // فلترة المهام المنجزة والتي لم يتم لمسها/المقصر فيها
        const completedTasks = tasks.filter(t => t.completed || t.progress === 100);
        const missedTasks = tasks.filter(t => !t.completed && (t.progress === 0 || t.status === 'skipped'));

        // بناء كارت اليوم
        const dayCard = document.createElement('div');
        dayCard.className = 'glass-panel day-card';

        dayCard.innerHTML = `
          <div class="day-header">
            <span class="day-date">📅 ${day.date || dateKey}</span>
          </div>

          <!-- قسم تم إنجازه -->
          <div class="summary-box done">
            <div class="summary-title" style="color: #2ecc71;">🎯 تم إنجازه:</div>
            <ul class="summary-list">
              ${completedTasks.length > 0 
                ? completedTasks.map(t => `<li>✅ ${t.name} ${t.detail ? `(${t.detail})` : ''}</li>`).join('')
                : '<li class="empty-text">لا توجد إنجازات مسجلة</li>'
              }
            </ul>
          </div>

          <!-- قسم لم يتم لمسه / تقصير -->
          <div class="summary-box missed">
            <div class="summary-title" style="color: #e74c3c;">⚠️ لم يتم لمسه / تقصير:</div>
            <ul class="summary-list">
              ${missedTasks.length > 0 
                ? missedTasks.map(t => `<li>❌ ${t.name}</li>`).join('')
                : '<li class="empty-text">لا يوجد تقصير، يوم ممتاز! 🎉</li>'
              }
            </ul>
          </div>
        `;

        historyContainer.appendChild(dayCard);
      });
    });
  </script>
</body>
</html>
