<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيقي - المهام ومواقيت الصلاة</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --gold-color: #fbbf24;
      --danger-color: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .container { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    h2 { font-size: 1.25rem; color: var(--accent-color); }

    .btn-icon {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }

    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      outline: none;
    }

    .btn-add {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.4);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }

    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .prayer-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .prayer-card.active {
      border-color: var(--gold-color);
      background: rgba(251, 191, 36, 0.15);
    }

    .prayer-name { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .prayer-time { font-size: 1rem; font-weight: bold; }

    .next-prayer-banner {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    .audio-notice {
      font-size: 0.8rem;
      color: var(--gold-color);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- عنصر الصوت المحلي الخفي (مهم جداً لحفظ الاعتماد المحلي) -->
  <audio id="local-azan-player" src="azan.mp3" preload="auto"></audio>

  <div class="container">
    
    <!-- قسم المهام -->
    <div class="card">
      <div class="header-bar">
        <h2>📝 قائمة المهام</h2>
      </div>

      <div class="input-group">
        <input type="text" id="task-input" placeholder="أضف مهمة جديدة..." onkeypress="if(event.key==='Enter') addTask()">
        <button class="btn-add" onclick="addTask()">إضافة</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
    </div>

    <!-- قسم مواقيت الصلاة -->
    <div class="card">
      <div class="header-bar">
        <h2>🕌 مواقيت الصلاة</h2>
        <button class="btn-icon" onclick="testAzan()">🔊 تجربة الأذان</button>
      </div>

      <div class="prayer-grid">
        <div class="prayer-card" id="card-Fajr"><div class="prayer-name">الفجر</div><div class="prayer-time" id="time-Fajr">--:--</div></div>
        <div class="prayer-card" id="card-Dhuhr"><div class="prayer-name">الظهر</div><div class="prayer-time" id="time-Dhuhr">--:--</div></div>
        <div class="prayer-card" id="card-Asr"><div class="prayer-name">العصر</div><div class="prayer-time" id="time-Asr">--:--</div></div>
        <div class="prayer-card" id="card-Maghrib"><div class="prayer-name">المغرب</div><div class="prayer-time" id="time-Maghrib">--:--</div></div>
        <div class="prayer-card" id="card-Isha"><div class="prayer-name">العشاء</div><div class="prayer-time" id="time-Isha">--:--</div></div>
      </div>

      <div class="next-prayer-banner" id="next-prayer-info">جاري حساب الوقت...</div>
      <div class="audio-notice">💡 اضغط في أي مكان بالصفحة مرة واحدة لتفعيل الأذان التلقائي بالخلفية.</div>
    </div>

  </div>

  <script>
    // --- 1. إعدادات الصوت المحلية الصارمة ---
    const azanAudio = document.getElementById('local-azan-player');
    let userHasInteracted = false;
    let playedPrayers = {};

    // السماح بالصوت فور أول لمسة للمستخدم للمتصفح (لتجاوز قيود أمان الموبايل)
    document.body.addEventListener('click', () => {
      if (!userHasInteracted) {
        userHasInteracted = true;
        // تجهيز الصوت في الذاكرة بدون إصدار صوت
        azanAudio.play().then(() => {
          azanAudio.pause();
          azanAudio.currentTime = 0;
        }).catch(() => {});
      }
    }, { once: true });

    function testAzan() {
      playAzanSound();
    }

    function playAzanSound() {
      azanAudio.currentTime = 0;
      azanAudio.play().catch(err => {
        console.warn("تنبيه: اضغط على الشاشة مرة واحدة لتفعيل الأذان.");
        alert("يرجى الضغط على الشاشة مرة واحدة للسماح بتشغيل الأذان في الخلفية.");
      });
    }

    // --- 2. إدارة المهام الحالية ---
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];

    function renderTasks() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      const list = document.getElementById('task-list');
      list.innerHTML = '';
      tasks.forEach((t, i) => {
        list.innerHTML += `
          <li class="task-item ${t.completed ? 'completed' : ''}">
            <span onclick="toggleTask(${i})" style="cursor:pointer; flex:1;">${t.text}</span>
            <button style="background:none; border:none; color:var(--danger-color); cursor:pointer;" onclick="deleteTask(${i})">🗑️</button>
          </li>`;
      });
    }

    function addTask() {
      const input = document.getElementById('task-input');
      if (input.value.trim()) {
        tasks.push({ text: input.value.trim(), completed: false });
        input.value = '';
        renderTasks();
      }
    }

    function toggleTask(i) { tasks[i].completed = !tasks[i].completed; renderTasks(); }
    function deleteTask(i) { tasks.splice(i, 1); renderTasks(); }

    // --- 3. حفظ ورصد مواقيت الصلاة أوفلاين (Offline First) ---
    // مواقيت افتراضية مثبتة تعمل بدون إنترنت إطلاقاً
    const defaultPrayers = {
      Fajr: "04:30",
      Dhuhr: "12:00",
      Asr: "15:30",
      Maghrib: "18:45",
      Isha: "20:15"
    };

    function getStoredPrayers() {
      return JSON.parse(localStorage.getItem('cached_prayers')) || defaultPrayers;
    }

    async function fetchAndCachePrayers() {
      try {
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Tanta&country=Egypt&method=5');
        const data = await res.json();
        if (data.data && data.data.timings) {
          localStorage.setItem('cached_prayers', JSON.stringify(data.data.timings));
          updatePrayerUI(data.data.timings);
        }
      } catch (e) {
        // في حال عدم وجود إنترنت، يتم الاعتماد على البيانات المخزنة
        updatePrayerUI(getStoredPrayers());
      }
    }

    function updatePrayerUI(timings) {
      const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      list.forEach(p => {
        if (timings[p]) {
          document.getElementById(`time-${p}`).innerText = timings[p];
        }
      });
      checkPrayerTime(timings);
    }

    function checkPrayerTime(timings) {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const currentTime = `${hours}:${mins}`;
      const today = now.toDateString();

      const prayers = [
        { name: 'الفجر', key: 'Fajr' },
        { name: 'الظهر', key: 'Dhuhr' },
        { name: 'العصر', key: 'Asr' },
        { name: 'المغرب', key: 'Maghrib' },
        { name: 'العشاء', key: 'Isha' }
      ];

      document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('active'));

      let next = null;

      for (let p of prayers) {
        const pTime = timings[p.key];

        // تشغيل الأذان عند مطابقة الوقت
        if (pTime === currentTime) {
          const key = `${today}-${p.key}`;
          if (!playedPrayers[key]) {
            playedPrayers[key] = true;
            playAzanSound();
          }
        }

        if (!next && pTime > currentTime) {
          next = { name: p.name, time: pTime, key: p.key };
        }
      }

      if (!next) next = { name: 'الفجر', time: timings['Fajr'], key: 'Fajr' };

      const activeCard = document.getElementById(`card-${next.key}`);
      if (activeCard) activeCard.classList.add('active');

      document.getElementById('next-prayer-info').innerText = `الصلاة القادمة: ${next.name} الساعة ${next.time}`;
    }

    // التشغيل عند الفتح
    window.onload = function() {
      renderTasks();
      updatePrayerUI(getStoredPrayers()); // عرض الفوري من الذاكرة
      fetchAndCachePrayers(); // تحديث من النت إن وجد

      // فحص دائم كل 5 ثوانٍ
      setInterval(() => {
        checkPrayerTime(getStoredPrayers());
      }, 5000);
    };
  </script>
</body>
</html>
