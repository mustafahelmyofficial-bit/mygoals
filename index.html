<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم المهام ومواقيت الصلاة</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --gold-color: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
      .full-width {
        grid-column: span 2;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    h2 {
      font-size: 1.25rem;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-color);
    }

    /* قسم المهام */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .btn-add {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.4);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* قسم المواقيت */
    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .prayer-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .prayer-card.active {
      border-color: var(--gold-color);
      background: rgba(251, 191, 36, 0.1);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .prayer-name {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .prayer-time {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .next-prayer-banner {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 0.95rem;
    }

    .test-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- قسم إدارة المهام -->
    <div class="card">
      <div class="header-bar">
        <h2>📝 قائمة المهام</h2>
        <button id="sound-toggle-btn" class="btn-icon" onclick="toggleSoundMaster()">🔊 الصوت: مفعل</button>
      </div>

      <div class="input-group">
        <input type="text" id="task-input" placeholder="أضف قائمة مهام جديدة..." onkeypress="if(event.key==='Enter') addTask()">
        <button class="btn-add" onclick="addTask()">إضافة</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
    </div>

    <!-- قسم مواقيت الصلاة والأذان -->
    <div class="card">
      <div class="header-bar">
        <h2>🕌 مواقيت الصلاة</h2>
        <div class="test-controls">
          <button class="btn-icon" onclick="playAzanSound()">🔊 تجربة الأذان</button>
        </div>
      </div>

      <div class="prayer-grid" id="prayer-grid">
        <div class="prayer-card" id="card-Fajr"><div class="prayer-name">الفجر</div><div class="prayer-time" id="time-Fajr">--:--</div></div>
        <div class="prayer-card" id="card-Dhuhr"><div class="prayer-name">الظهر</div><div class="prayer-time" id="time-Dhuhr">--:--</div></div>
        <div class="prayer-card" id="card-Asr"><div class="prayer-name">العصر</div><div class="prayer-time" id="time-Asr">--:--</div></div>
        <div class="prayer-card" id="card-Maghrib"><div class="prayer-name">المغرب</div><div class="prayer-time" id="time-Maghrib">--:--</div></div>
        <div class="prayer-card" id="card-Isha"><div class="prayer-name">العشاء</div><div class="prayer-time" id="time-Isha">--:--</div></div>
      </div>

      <div class="next-prayer-banner" id="next-prayer-info">
        جاري حساب الصلاة القادمة...
      </div>
    </div>

  </div>

  <script>
    // --- 1. إعدادات الصوت والأذان المحدثة والمضمونة ---
    let soundEnabled = true;
    let audioCtx = null;
    let playedPrayersToday = {}; // منع تكرار الصوت لنفس الصلاة في الدقيقة الواحدة

    function toggleSoundMaster() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-toggle-btn');
      btn.innerText = soundEnabled ? '🔊 الصوت: مفعل' : '🔇 الصوت: مكتوم';
    }

    // صوت إنجاز/نقر المهام التفاعلي (Web Audio API)
    function playClickSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        console.error("خطأ في تشغيل صوت المهام:", e);
      }
    }

    // صوت تنبيه داخلي احتياطي للصلوات (Fallback Beep) عند انقطاع الشبكة أو حظر MP3
    function playFallbackBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 1.2);
      } catch (e) {
        console.error("خطأ في تشغيل صوت التنبيه البديل:", e);
      }
    }

    // ملف صوت الأذان رابط مباشر وموثوق من Archive.org
    const azanAudio = new Audio('https://ia800203.us.archive.org/14/items/AdhanMakkah/Adhan%20Makkah.mp3');
    azanAudio.preload = 'auto';

    function playAzanSound() {
      if (!soundEnabled) return;

      // تفعيل AudioContext للتأكد من موافقة المتصفح
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      azanAudio.currentTime = 0;
      
      const playPromise = azanAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          console.log("تم تشغيل صوت الأذان بنجاح.");
        }).catch(error => {
          console.warn("تعذر تشغيل ملف الأذان MP3، سيتم تشغيل التنبيه البديل:", error);
          playFallbackBeep();
        });
      }
    }

    // --- 2. إدارة قائمة المهام (Tasks Management) ---
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];

    function saveAndRenderTasks() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor: pointer; flex: 1;">${task.text}</span>
          <div class="task-actions">
            <button class="btn-del" onclick="deleteTask(${index})">🗑️</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (text) {
        tasks.push({ text: text, completed: false });
        input.value = '';
        playClickSound();
        saveAndRenderTasks();
      }
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      playClickSound();
      saveAndRenderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      playClickSound();
      saveAndRenderTasks();
    }

    // --- 3. نظام مواقيت الصلاة والتنبيه التلقائي ---
    let prayerTimesData = {};

    async function fetchPrayerTimes() {
      try {
        // مواقيت طنطا، الغربية، مصر
        const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Tanta&country=Egypt&method=5');
        const data = await response.json();
        if (data.code === 200) {
          prayerTimesData = data.data.timings;
          updatePrayerUI();
        }
      } catch (err) {
        console.error("فشل جلب مواقيت الصلاة:", err);
        document.getElementById('next-prayer-info').innerText = "تعذر تحميل المواقيت، تحقق من الاتصال بالإنترنت.";
      }
    }

    function updatePrayerUI() {
      const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      prayers.forEach(p => {
        if (prayerTimesData[p]) {
          document.getElementById(`time-${p}`).innerText = prayerTimesData[p];
        }
      });
      checkPrayerTime();
    }

    function checkPrayerTime() {
      if (!prayerTimesData.Fajr) return;

      const now = new Date();
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      const currentTimeStr = `${currentHours}:${currentMinutes}`;
      const todayStr = now.toDateString();

      const prayers = [
        { name: 'الفجر', key: 'Fajr' },
        { name: 'الظهر', key: 'Dhuhr' },
        { name: 'العصر', key: 'Asr' },
        { name: 'المغرب', key: 'Maghrib' },
        { name: 'العشاء', key: 'Isha' }
      ];

      let nextPrayer = null;

      // إعادة ضبط التنبيهات مع بداية يوم جديد
      document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('active'));

      for (let p of prayers) {
        const pTime = prayerTimesData[p.key];
        
        // التحقق من موعد الصلاة الحالية للتنبيه
        if (pTime === currentTimeStr) {
          const eventKey = `${todayStr}-${p.key}`;
          if (!playedPrayersToday[eventKey]) {
            playedPrayersToday[eventKey] = true;
            playAzanSound();
          }
        }

        // تحديد الصلاة القادمة
        if (!nextPrayer && pTime > currentTimeStr) {
          nextPrayer = { name: p.name, time: pTime, key: p.key };
        }
      }

      // إذا انتهت صلوات اليوم تكون الصلاة القادمة هي الفجر غداً
      if (!nextPrayer) {
        nextPrayer = { name: 'الفجر', time: prayerTimesData['Fajr'], key: 'Fajr' };
      }

      // تظليل بطاقة الصلاة القادمة
      const activeCard = document.getElementById(`card-${nextPrayer.key}`);
      if (activeCard) activeCard.classList.add('active');

      document.getElementById('next-prayer-info').innerText = `الصلاة القادمة: ${nextPrayer.name} الساعة ${nextPrayer.time}`;
    }

    // --- التهيئة عند تحميل الصفحة ---
    window.onload = function() {
      saveAndRenderTasks();
      fetchPrayerTimes();
      // فحص الوقت كل 10 ثوانٍ لضمان الدقة وتأدية الأذان في موعده
      setInterval(checkPrayerTime, 10000);
    };
  </script>
</body>
</html>
