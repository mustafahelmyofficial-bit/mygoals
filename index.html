<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy LMS - Personal Learning Hub</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* Color Palette: Beige, Brown, Gold & Glassmorphic Accents */
      --bg-gradient-dark: linear-gradient(135deg, #1c1917 0%, #292524 50%, #1c1917 100%);
      --glass-bg-dark: rgba(41, 37, 36, 0.65);
      --glass-border-dark: rgba(217, 119, 6, 0.2);
      --text-main-dark: #f5f5f4;
      --text-muted-dark: #a8a29e;
      
      --bg-gradient-light: linear-gradient(135deg, #fef3c7 0%, #fef3c7 30%, #f5f5f4 100%);
      --glass-bg-light: rgba(255, 255, 255, 0.75);
      --glass-border-light: rgba(180, 83, 9, 0.15);
      --text-main-light: #292524;
      --text-muted-light: #78716c;

      --accent-gold: #d97706;
      --accent-gold-hover: #b45309;
      --accent-green: #10b981;
      --accent-brown: #78350f;
      --card-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: var(--bg-gradient-dark);
      --glass: var(--glass-bg-dark);
      --border: var(--glass-border-dark);
      --text: var(--text-main-dark);
      --text-muted: var(--text-muted-dark);
      --card-bg: rgba(28, 25, 23, 0.5);
    }

    [data-theme="light"] {
      --bg: var(--bg-gradient-light);
      --glass: var(--glass-bg-light);
      --border: var(--glass-border-light);
      --text: var(--text-main-light);
      --text-muted: var(--text-muted-light);
      --card-bg: rgba(255, 255, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      background-attachment: fixed;
    }

    /* Glassmorphic Container */
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    /* Navbar Header */
    header {
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1.5rem 2rem 0 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .nav-tools {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-icon:hover {
      background: var(--accent-gold);
      color: #fff;
      border-color: var(--accent-gold);
    }

    /* Layout Structure */
    .app-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      flex-grow: 1;
    }

    /* Sidebar Navigation */
    .sidebar {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .menu-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-item {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(217, 119, 6, 0.15);
      color: var(--accent-gold);
      border-left: 3px solid var(--accent-gold);
    }

    /* Main View Area */
    .main-content {
      padding: 2rem;
      overflow-y: auto;
    }

    /* Categories Grid */
    .grid-categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .category-card {
      padding: 1.5rem;
      border-radius: var(--card-radius);
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .category-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-gold);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .category-icon {
      font-size: 2rem;
    }

    /* Level Accordions & Lesson Cards */
    .level-container {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .level-header {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }

    .lessons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .lesson-card {
      padding: 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }

    .lesson-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .badge-completed {
      color: var(--accent-green);
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* Single Lesson View / Checklist */
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .checklist-item input[type="checkbox"] {
      accent-color: var(--accent-gold);
      width: 18px;
      height: 18px;
    }

    /* Progress & Statistics Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      padding: 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(120, 113, 108, 0.3);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      header {
        margin: 1rem 1rem 0 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Glass Header -->
  <header class="glass-panel">
    <div class="brand">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>Academy</span>
    </div>
    <div class="nav-tools">
      <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="app-container">
    
    <!-- Navigation Sidebar -->
    <aside class="sidebar glass-panel">
      <div>
        <div class="menu-title">Main Dashboard</div>
        <ul class="nav-list">
          <li class="nav-item active" onclick="switchTab('categories', event)">
            <i class="fa-solid fa-layer-group"></i> Categories
          </li>
          <li class="nav-item" onclick="switchTab('reviews', event)">
            <i class="fa-solid fa-clock-rotate-left"></i> Today's Reviews
          </li>
          <li class="nav-item" onclick="switchTab('progress', event)">
            <i class="fa-solid fa-chart-line"></i> Progress & Stats
          </li>
          <li class="nav-item" onclick="switchTab('vocab', event)">
            <i class="fa-solid fa-book-bookmark"></i> Vocabulary Tracker
          </li>
        </ul>
      </div>
    </aside>

    <!-- Content Workspace -->
    <main class="main-content glass-panel" id="workspace">
      <!-- Dynamic View Rendered via JavaScript -->
    </main>

  </div>

  <script>
    /* ===================================================
       1. DATA ARCHITECTURE & EXTENSIBLE LMS STRUCTURE
    =================================================== */
    const defaultData = {
      userStats: {
        streak: 5,
        totalHours: 12.5,
      },
      categories: [
        { id: 'english', name: 'English', icon: '🇺🇸', description: 'Complete fluency roadmap' },
        { id: 'interior', name: 'Interior Design', icon: '🏠', description: 'Spatial layout & concepts' },
        { id: 'sketchup', name: 'SketchUp', icon: '📐', description: '3D Architectural modeling' },
        { id: 'vray', name: 'V-Ray', icon: '🎨', description: 'Photorealistic Rendering' },
        { id: 'd5', name: 'D5 Render', icon: '💡', description: 'Real-time Architectural Viz' },
        { id: 'photoshop', name: 'Photoshop', icon: '🖼', description: 'Post-production & Editing' },
        { id: 'social', name: 'Social Media', icon: '📱', description: 'Content creation & Growth' },
        { id: 'freelance', name: 'Freelancing', icon: '💼', description: 'Client management & Sales' }
      ],
      roadmaps: {
        english: [
          {
            level: 'A0 - Absolute Beginner',
            lessons: [
              { id: 'a0_1', title: 'Alphabet & Phonetics', time: '20 mins', vocabCount: 26, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] },
              { id: 'a0_2', title: 'Greetings & Introductions', time: '25 mins', vocabCount: 15, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] },
              { id: 'a0_3', title: 'Days, Months & Numbers', time: '30 mins', vocabCount: 40, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] }
            ]
          },
          {
            level: 'A1 - Beginner',
            lessons: [
              { id: 'a1_1', title: 'Personal Pronouns & To Be', time: '30 mins', vocabCount: 12, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] },
              { id: 'a1_2', title: 'Present Simple & Daily Routine', time: '40 mins', vocabCount: 20, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] }
            ]
          },
          {
            level: 'B2 - Upper Intermediate',
            lessons: [
              { id: 'b2_1', title: 'Business English & Emails', time: '45 mins', vocabCount: 25, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] }
            ]
          },
          {
            level: 'C1 - Advanced & Professional',
            lessons: [
              { id: 'c1_1', title: 'Interior Design English & Client Communication', time: '60 mins', vocabCount: 35, completed: false, checklist: ['Watch the lesson', 'Read the summary', 'Learn the vocabulary', 'Complete the exercises', 'Review after 24 hours'] }
            ]
          }
        ]
      },
      reviews: [
        { lessonTitle: 'Alphabet & Phonetics', level: 'A0', dueIn: '1 Day (Spaced Repetition)' },
        { lessonTitle: 'Greetings & Introductions', level: 'A0', dueIn: '3 Days' }
      ],
      vocab: { learned: 42, total: 173 }
    };

    let state = JSON.parse(localStorage.getItem('academy_lms_db')) || defaultData;
    function saveData() {
      localStorage.setItem('academy_lms_db', JSON.stringify(state));
    }

    /* ===================================================
       2. UI NAVIGATION & NAVIGATION RENDERING
    =================================================== */
    function switchTab(tabName, event) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if(event && event.currentTarget) event.currentTarget.classList.add('active');
      
      if (tabName === 'categories') renderCategories();
      else if (tabName === 'reviews') renderReviews();
      else if (tabName === 'progress') renderProgress();
      else if (tabName === 'vocab') renderVocab();
    }

    function renderCategories() {
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = `
        <h2>Learning Categories</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Select a track to view its personalized learning roadmap.</p>
        <div class="grid-categories">
          ${state.categories.map(cat => `
            <div class="category-card" onclick="openRoadmap('${cat.id}', '${cat.name}')">
              <div class="category-icon">${cat.icon}</div>
              <h3>${cat.name}</h3>
              <p style="font-size: 0.85rem; color: var(--text-muted);">${cat.description}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openRoadmap(catId, catName) {
      const workspace = document.getElementById('workspace');
      const roadmap = state.roadmaps[catId] || [];

      if (roadmap.length === 0) {
        workspace.innerHTML = `
          <button class="btn-icon" onclick="renderCategories()" style="margin-bottom:1rem;"><i class="fa-solid fa-arrow-left"></i></button>
          <h2>${catName} Roadmap</h2>
          <p style="color: var(--text-muted); margin-top: 1rem;">This track is currently being prepared. Check back soon!</p>
        `;
        return;
      }

      workspace.innerHTML = `
        <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
          <button class="btn-icon" onclick="renderCategories()"><i class="fa-solid fa-arrow-left"></i></button>
          <h2>${catName} Learning Roadmap</h2>
        </div>
        <div class="level-container">
          ${roadmap.map(lvl => `
            <div>
              <div class="level-header">
                <span>${lvl.level}</span>
              </div>
              <div class="lessons-grid">
                ${lvl.lessons.map(lesson => `
                  <div class="lesson-card" onclick="openLesson('${catId}', '${lesson.id}')">
                    <div>
                      <h4 style="margin-bottom: 0.5rem;">${lesson.title}</h4>
                      <p style="font-size: 0.8rem; color: var(--text-muted);"><i class="fa-regular fa-clock"></i> ${lesson.time}</p>
                    </div>
                    <div>
                      ${lesson.completed 
                        ? `<span class="badge-completed"><i class="fa-solid fa-circle-check"></i> Completed</span>` 
                        : `<span style="font-size:0.8rem; color: var(--text-muted);">In Progress</span>`
                      }
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openLesson(catId, lessonId) {
      const workspace = document.getElementById('workspace');
      let foundLesson = null;

      state.roadmaps[catId].forEach(lvl => {
        lvl.lessons.forEach(l => { if (l.id === lessonId) foundLesson = l; });
      });

      workspace.innerHTML = `
        <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
          <button class="btn-icon" onclick="openRoadmap('${catId}', 'English')"><i class="fa-solid fa-arrow-left"></i></button>
          <h2>${foundLesson.title}</h2>
        </div>
        
        <div style="max-width: 600px;">
          <p style="color: var(--text-muted); margin-bottom: 1.5rem;"><i class="fa-regular fa-clock"></i> Estimated Study Time: ${foundLesson.time}</p>
          
          <h3 style="margin-bottom: 1rem;">Lesson Objectives & Checklist</h3>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Complete all checklist items below to automatically mark this lesson as completed.</p>
          
          <div id="checklist-container">
            ${foundLesson.checklist.map((item) => `
              <label class="checklist-item">
                <input type="checkbox" ${foundLesson.completed ? 'checked' : ''} onchange="toggleChecklist('${catId}', '${lessonId}')">
                <span>${item}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Completely Silent Checklist State Management
    function toggleChecklist(catId, lessonId) {
      const checkboxes = document.querySelectorAll('#checklist-container input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);

      state.roadmaps[catId].forEach(lvl => {
        lvl.lessons.forEach(l => {
          if (l.id === lessonId) {
            l.completed = allChecked;
          }
        });
      });
      saveData();
    }

    /* ===================================================
       3. PROGRESS, REVIEWS & VOCABULARY VIEWS
    =================================================== */
    function renderReviews() {
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = `
        <h2>Smart Review System (Spaced Repetition)</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Scheduled reviews (1, 3, 7, 14, 30 Days) to ensure long-term memory retention.</p>
        
        <div style="display:flex; flex-direction:column; gap: 1rem; max-width: 600px;">
          ${state.reviews.map(rev => `
            <div class="checklist-item" style="justify-content: space-between;">
              <div>
                <strong>${rev.lessonTitle}</strong>
                <p style="font-size:0.8rem; color: var(--text-muted);">Level: ${rev.level}</p>
              </div>
              <span style="color: var(--accent-gold); font-size: 0.85rem; font-weight:600;"><i class="fa-solid fa-rotate"></i> Due in ${rev.dueIn}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderProgress() {
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = `
        <h2>Learning Statistics & Progress</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Automated real-time overview of your learning journey.</p>
        
        <div class="stats-grid">
          <div class="stat-card">
            <span style="color:var(--text-muted); font-size:0.85rem;">Study Streak</span>
            <div class="stat-value">🔥 ${state.userStats.streak} Days</div>
          </div>
          <div class="stat-card">
            <span style="color:var(--text-muted); font-size:0.85rem;">Total Hours Studied</span>
            <div class="stat-value">⚡ ${state.userStats.totalHours} hrs</div>
          </div>
          <div class="stat-card">
            <span style="color:var(--text-muted); font-size:0.85rem;">Overall Completion</span>
            <div class="stat-value">15%</div>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" style="width: 15%;"></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderVocab() {
      const workspace = document.getElementById('workspace');
      const pct = Math.round((state.vocab.learned / state.vocab.total) * 100);
      workspace.innerHTML = `
        <h2>Vocabulary Tracker</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Track vocabulary acquisition across all lessons.</p>
        
        <div class="stat-card" style="max-width: 400px; margin-bottom: 1.5rem;">
          <h3>Vocabulary Progress</h3>
          <div class="stat-value" style="margin-top: 0.5rem;">${state.vocab.learned} / ${state.vocab.total} Words</div>
          <p style="color: var(--text-muted); font-size: 0.85rem;">${pct}% Completed</p>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${pct}%;"></div>
          </div>
        </div>
      `;
    }

    /* ===================================================
       4. THEME & UTILITIES
    =================================================== */
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      
      const icon = document.querySelector('#theme-toggle i');
      icon.className = next === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }

    // App Initialization
    renderCategories();
  </script>
</body>
</html>
