<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإنجاز الشخصية (أوفلاين 100%)</title>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #2b1d0f, #4a3525, #1a1007);
      --glass-bg: rgba(245, 237, 224, 0.08);
      --glass-border: rgba(212, 175, 55, 0.25);
      --text-main: #f5ede0;
      --text-muted: #d4c5b3;
      --accent-gold: #d4af37;
      --accent-brown: #8b5a2b;
      --accent-green: #4caf50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h2, h3, h4 {
      color: var(--accent-gold);
      margin-bottom: 12px;
    }

    /* Controls & Date Inputs */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    input, select, button {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
    }

    input[type="date"] {
      color-scheme: dark;
    }

    button {
      background: var(--accent-gold);
      color: #2b1d0f;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #f3cf65;
      transform: translateY(-2px);
    }

    /* Progress Bar */
    .progress-container {
      margin-top: 15px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-brown), var(--accent-gold));
      transition: width 0.4s ease-in-out;
    }

    /* Task Lists */
    .task-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .task-input-group input {
      flex: 1;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-postpone {
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    .btn-postpone:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-delete {
      background: rgba(255, 77, 77, 0.2);
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
    }

    .btn-delete:hover {
      background: #ff6b6b;
      color: #fff;
    }

    /* History Grid */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .history-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .history-card:hover {
      border-color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.1);
    }

    .history-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .history-percent {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. إعدادات التحدي وتحديد اليوم -->
  <div class="glass-card">
    <h2>تتبع الإنجاز والتحدي (Local Storage)</h2>
    <div class="controls-grid">
      <div>
        <label>تاريخ بدء التحدي:</label>
        <input type="date" id="challengeStartDate" onchange="saveStartDate(this.value)" style="width: 100%; margin-top: 5px;">
      </div>
      <div>
        <label>عرض/تعديل يوم معين:</label>
        <input type="date" id="selectedDate" onchange="changeActiveDate(this.value)" style="width: 100%; margin-top: 5px;">
      </div>
    </div>

    <!-- شريط نسبة الإنجاز -->
    <div class="progress-container">
      <div class="progress-header">
        <span>نسبة إنجاز اليوم المختار (<span id="displayDateLabel">اليوم</span>):</span>
        <strong id="dailyPercentage">0%</strong>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>
  </div>

  <!-- 2. قسم إضافة وإدارة مهام اليوم -->
  <div class="glass-card">
    <h3>قائمة المهام</h3>
    <div class="task-input-group">
      <input type="text" id="newTaskInput" placeholder="أضف مهمة جديدة...">
      <button onclick="addNewTask()">إضافة</button>
    </div>
    <ul id="taskList" class="task-list"></ul>
  </div>

  <!-- 3. قسم المهام المؤجلة -->
  <div class="glass-card">
    <h3>المهام المؤجلة (تنتظر التنفيذ)</h3>
    <ul id="postponedTaskList" class="task-list"></ul>
  </div>

  <!-- 4. سجل الأيام السابقة -->
  <div class="glass-card">
    <h3>سجل النسب للأيام السابقة</h3>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">اضغط على أي يوم للتعديل على مهامه:</p>
    <div id="historyGrid" class="history-grid"></div>
  </div>

</div>

<script>
  // Variables
  let currentDate = new Date().toISOString().split('T')[0];
  let activeTasks = [];
  let postponedTasks = [];

  // Init App
  window.onload = function() {
    document.getElementById('selectedDate').value = currentDate;
    document.getElementById('displayDateLabel').innerText = currentDate;
    
    loadStartDate();
    loadDayData(currentDate);
    loadPostponedTasks();
    loadHistoryLog();
  };

  // --- 1. تاريخ بدء التحدي ---
  function saveStartDate(dateVal) {
    localStorage.setItem('challenge_start_date', dateVal);
  }

  function loadStartDate() {
    const savedDate = localStorage.getItem('challenge_start_date');
    if (savedDate) {
      document.getElementById('challengeStartDate').value = savedDate;
    }
  }

  function changeActiveDate(dateVal) {
    currentDate = dateVal;
    document.getElementById('displayDateLabel').innerText = currentDate;
    loadDayData(currentDate);
  }

  // --- 2. إدارة البيانات محليًا (Local Storage) ---
  function loadDayData(dateStr) {
    const savedData = localStorage.getItem(`tasks_${dateStr}`);
    activeTasks = savedData ? JSON.parse(savedData) : [];
    renderTasks();
    calculateAndSaveProgress();
  }

  function saveCurrentDayTasks() {
    localStorage.setItem(`tasks_${currentDate}`, JSON.stringify(activeTasks));
    calculateAndSaveProgress();
    renderTasks();
    loadHistoryLog(); // تحديث كروت السجل تلقائيًا
  }

  function renderTasks() {
    const listEl = document.getElementById('taskList');
    listEl.innerHTML = '';

    activeTasks.forEach((task, index) => {
      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      li.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
          <span>${task.title}</span>
        </div>
        <div class="task-actions">
          ${!task.completed ? `<button class="btn-action btn-postpone" onclick="postponeTask(${index})">تأجيل</button>` : ''}
          <button class="btn-action btn-delete" onclick="deleteTask(${index})">حذف</button>
        </div>
      `;
      listEl.appendChild(li);
    });
  }

  function addNewTask() {
    const input = document.getElementById('newTaskInput');
    const title = input.value.trim();
    if (!title) return;

    activeTasks.push({ title: title, completed: false });
    input.value = '';
    saveCurrentDayTasks();
  }

  function toggleTask(index) {
    activeTasks[index].completed = !activeTasks[index].completed;
    saveCurrentDayTasks();
  }

  function deleteTask(index) {
    activeTasks.splice(index, 1);
    saveCurrentDayTasks();
  }

  // --- 3. قسم التأجيل أوفلاين ---
  function postponeTask(index) {
    const taskToPostpone = activeTasks.splice(index, 1)[0];
    
    // إضافتها للمؤجلة
    postponedTasks.push({ title: taskToPostpone.title, postponedAt: currentDate });
    localStorage.setItem('postponed_tasks', JSON.stringify(postponedTasks));

    saveCurrentDayTasks();
    renderPostponedTasks();
  }

  function loadPostponedTasks() {
    const savedPostponed = localStorage.getItem('postponed_tasks');
    postponedTasks = savedPostponed ? JSON.parse(savedPostponed) : [];
    renderPostponedTasks();
  }

  function renderPostponedTasks() {
    const postponedList = document.getElementById('postponedTaskList');
    postponedList.innerHTML = '';

    postponedTasks.forEach((task, index) => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <span>${task.title}</span>
        <button class="btn-action" style="background: var(--accent-green); color: #fff;" onclick="restoreTask(${index})">إعادة لليوم</button>
      `;
      postponedList.appendChild(li);
    });
  }

  function restoreTask(index) {
    const restored = postponedTasks.splice(index, 1)[0];
    localStorage.setItem('postponed_tasks', JSON.stringify(postponedTasks));

    activeTasks.push({ title: restored.title, completed: false });
    saveCurrentDayTasks();
    renderPostponedTasks();
  }

  // --- 4. النسبة المئوية والسجل المحلي ---
  function calculateAndSaveProgress() {
    if (activeTasks.length === 0) {
      updateProgressUI(0);
      saveHistoryStat(0);
      return;
    }

    const completedCount = activeTasks.filter(t => t.completed).length;
    const percentage = Math.round((completedCount / activeTasks.length) * 100);

    updateProgressUI(percentage);
    saveHistoryStat(percentage);
  }

  function updateProgressUI(percentage) {
    document.getElementById('dailyPercentage').innerText = `${percentage}%`;
    document.getElementById('progressBarFill').style.width = `${percentage}%`;
  }

  function saveHistoryStat(percentage) {
    let history = JSON.parse(localStorage.getItem('history_stats') || '{}');
    history[currentDate] = percentage;
    localStorage.setItem('history_stats', JSON.stringify(history));
  }

  function loadHistoryLog() {
    const grid = document.getElementById('historyGrid');
    grid.innerHTML = '';

    const history = JSON.parse(localStorage.getItem('history_stats') || '{}');
    const sortedDates = Object.keys(history).sort().reverse();

    sortedDates.forEach(dateStr => {
      const card = document.createElement('div');
      card.className = 'history-card';
      card.onclick = () => {
        document.getElementById('selectedDate').value = dateStr;
        changeActiveDate(dateStr);
      };
      card.innerHTML = `
        <div class="history-date">${dateStr}</div>
        <div class="history-percent">${history[dateStr]}%</div>
      `;
      grid.appendChild(card);
    });
  }
</script>

</body>
</html>
